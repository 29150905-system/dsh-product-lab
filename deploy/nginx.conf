# /etc/nginx/conf.d/jingming.conf
# 把 jingming.example.com 换成你的域名；证书路径由 certbot 自动生成
# 需要 nginx >= 1.25（支持 http2 on;）；旧版本把 http2 on; 改成 listen 443 ssl http2;

server {
    listen 80;
    listen [::]:80;
    server_name jingming.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jingming.example.com;

    ssl_certificate     /etc/letsencrypt/live/jingming.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jingming.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Next.js 静态资源：长缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service Worker：不缓存
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 模型生成可能较慢
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
